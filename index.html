<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HTML5 IMU Room Mapper (Android Fix)</title>
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #00ffcc;
            --error-color: #ff3366;
            --canvas-bg: #000000;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        #ui-container {
            padding: 15px;
            background-color: rgba(18, 18, 18, 0.9);
            z-index: 10;
            border-bottom: 1px solid var(--text-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .data-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
        }
        button {
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            color: var(--bg-color);
            background-color: var(--text-color);
            border: none;
            border-radius: 5px;
            text-transform: uppercase;
            touch-action: manipulation;
            cursor: pointer;
        }
        button:active {
            opacity: 0.7;
        }
        #debug-log {
            font-size: 10px;
            color: #ffff00;
            background: #000;
            padding: 5px;
            height: 80px;
            overflow-y: scroll;
            border: 1px solid #555;
        }
        #canvas-container {
            flex-grow: 1;
            position: relative;
            width: 100%;
            background-color: var(--canvas-bg);
            background-image: 
                linear-gradient(rgba(0, 255, 204, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 204, 0.1) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <div class="data-row">
            <span>Steps: <span id="step-count">0</span></span>
            <span>Heading: <span id="heading-data">0°</span></span>
        </div>
        <div class="data-row">
            <span>Pos X: <span id="pos-x">0.00</span>m</span>
            <span>Pos Y: <span id="pos-y">0.00</span>m</span>
        </div>
        <div class="data-row" style="color: #aaa; font-size: 11px;">
            <span>Live Accel Mag: <span id="accel-mag">0.00</span></span>
        </div>
        <button id="start-btn">Start Mapping</button>
        <button id="reset-btn" style="display: none; background-color: var(--error-color); color: white;">Reset Map</button>
        <div id="debug-log">System Initialized. Awaiting start...<br></div>
    </div>

    <div id="canvas-container">
        <canvas id="map-canvas"></canvas>
    </div>

    <script>
        let isMapping = false;
        let steps = 0;
        let currentHeading = 0; 
        let posX = 0;
        let posY = 0;
        const stepLength = 0.6; 
        
        // Lowered threshold for easier triggering on mobile
        const stepThreshold = 10.5; 
        let lastStepTime = 0;
        const stepCooldown = 350; 
        let path = [{ x: 0, y: 0 }];

        const startBtn = document.getElementById('start-btn');
        const resetBtn = document.getElementById('reset-btn');
        const stepCountEl = document.getElementById('step-count');
        const headingEl = document.getElementById('heading-data');
        const posXEl = document.getElementById('pos-x');
        const posYEl = document.getElementById('pos-y');
        const accelMagEl = document.getElementById('accel-mag');
        const debugLog = document.getElementById('debug-log');
        const canvas = document.getElementById('map-canvas');
        const ctx = canvas.getContext('2d');

        function logDebug(message, isError = false) {
            const time = new Date().toLocaleTimeString();
            const span = document.createElement('span');
            span.style.color = isError ? '#ff3366' : '#ffff00';
            span.innerText = `[${time}] ${message}\n`;
            debugLog.appendChild(span);
            debugLog.scrollTop = debugLog.scrollHeight;
        }

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            drawMap();
        }
        window.addEventListener('resize', resizeCanvas);

        function drawMap() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const scale = 30;

            ctx.save();
            ctx.translate(centerX, centerY);

            if (path.length > 0) {
                ctx.beginPath();
                ctx.moveTo(path[0].x * scale, -path[0].y * scale); 
                for (let i = 1; i < path.length; i++) {
                    ctx.lineTo(path[i].x * scale, -path[i].y * scale);
                }
                ctx.strokeStyle = '#00ffcc';
                ctx.lineWidth = 3;
                ctx.lineJoin = 'round';
                ctx.stroke();
            }

            ctx.beginPath();
            ctx.arc(posX * scale, -posY * scale, 6, 0, Math.PI * 2);
            ctx.fillStyle = '#ff3366';
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(posX * scale, -posY * scale);
            const pointerX = posX * scale + Math.sin(currentHeading) * 15;
            const pointerY = -posY * scale - Math.cos(currentHeading) * 15; 
            ctx.lineTo(pointerX, pointerY);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.restore();
        }

        function handleOrientation(event) {
            let alpha = 0;

            if (event.webkitCompassHeading) {
                alpha = event.webkitCompassHeading;
            } else if (event.alpha !== null) {
                alpha = event.absolute ? (360 - event.alpha) : event.alpha;
            }

            currentHeading = alpha * (Math.PI / 180);
            headingEl.innerText = Math.round(alpha) + '°';
            if (isMapping) drawMap();
        }

        function handleMotion(event) {
            if (!isMapping) return;

            const acc = event.accelerationIncludingGravity || event.acceleration;
            if (!acc) return;

            const magnitude = Math.sqrt(
                Math.pow(acc.x || 0, 2) + 
                Math.pow(acc.y || 0, 2) + 
                Math.pow(acc.z || 0, 2)
            );

            accelMagEl.innerText = magnitude.toFixed(2);

            const currentTime = new Date().getTime();

            // Detect step peak
            if (magnitude > stepThreshold && (currentTime - lastStepTime > stepCooldown)) {
                lastStepTime = currentTime;
                steps++;
                stepCountEl.innerText = steps;

                posX += Math.sin(currentHeading) * stepLength;
                posY += Math.cos(currentHeading) * stepLength; 

                posXEl.innerText = posX.toFixed(2);
                posYEl.innerText = posY.toFixed(2);

                path.push({ x: posX, y: posY });
                drawMap();
            }
        }

        startBtn.addEventListener('click', () => {
            isMapping = true;
            startBtn.style.display = 'none';
            resetBtn.style.display = 'block';

            // Android absolute compass listener fix
            if ('ondeviceorientationabsolute' in window) {
                window.addEventListener('deviceorientationabsolute', handleOrientation, true);
                logDebug("Using absolute Android compass listener.");
            } else if (window.DeviceOrientationEvent) {
                window.addEventListener('deviceorientation', handleOrientation, true);
                logDebug("Using standard orientation listener.");
            }

            if (window.DeviceMotionEvent) {
                window.addEventListener('devicemotion', handleMotion, true);
                logDebug("Motion listener attached.");
            }

            resizeCanvas();
        });

        resetBtn.addEventListener('click', () => {
            steps = 0; posX = 0; posY = 0; path = [{ x: 0, y: 0 }];
            stepCountEl.innerText = steps; posXEl.innerText = '0.00'; posYEl.innerText = '0.00';
            drawMap();
            logDebug("Map reset.");
        });

        resizeCanvas();
    </script>
</body>
</html>
