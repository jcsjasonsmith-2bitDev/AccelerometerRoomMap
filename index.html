<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IMU Room Mapper</title>
    <style>
        :root { --bg:#090c10; --cyan:#00e6c3; --red:#ff3b6b; --muted:#8aa0b3; --warn:#ffd166; }
        * { box-sizing: border-box; }
        html, body { margin:0; height:100%; background:var(--bg); color:var(--cyan);
            font-family: ui-monospace, Menlo, Consolas, monospace; display:flex; flex-direction:column; overflow:hidden; }
        #ui { padding:10px 12px; background:#0c1218; border-bottom:1px solid #1c3a3a; z-index:2; }
        .row { display:flex; justify-content:space-between; gap:8px; font-size:12px; margin:3px 0; }
        .muted { color:var(--muted); font-size:10px; }
        .warn { color:var(--warn); }
        .err { color:var(--red); }
        button { flex:1; padding:11px; font-weight:800; border:0; border-radius:6px; text-transform:uppercase; font-size:13px; }
        #go { background:var(--cyan); color:#04110e; }
        #reset { background:var(--red); color:#fff; display:none; }
        #mark { background:#1b3a4a; color:var(--cyan); display:none; }
        .btns { display:flex; gap:8px; margin-top:6px; }
        #dbg { height:70px; overflow:auto; background:#000; color:var(--warn); font-size:10px; padding:6px; border:1px solid #333; white-space:pre-wrap; }
        #wrap { flex:1; position:relative; background:#000;
            background-image: linear-gradient(rgba(0,230,195,.08) 1px,transparent 1px),
                              linear-gradient(90deg,rgba(0,230,195,.08) 1px,transparent 1px);
            background-size:24px 24px; }
        canvas { width:100%; height:100%; display:block; }
        #hint { position:absolute; left:8px; right:8px; bottom:8px; color:var(--muted); font-size:11px; }
    </style>
</head>
<body>
<div id="ui">
    <div class="row"><span>Steps <b id="steps">0</b></span><span>Heading <b id="hdg">—</b></span></div>
    <div class="row"><span>X <b id="px">0.00</b> m</span><span>Y <b id="py">0.00</b> m</span></div>
    <div class="row muted">
        <span>lin|a| <b id="mag">0.00</b></span>
        <span>src <b id="src">none</b></span>
    </div>
    <div class="row muted"><span id="raw">ax=— ay=— az=— gx=— gy=— gz=—</span></div>
    <div class="btns">
        <button id="go">Start sensors</button>
        <button id="mark">Step now</button>
        <button id="reset">Reset</button>
    </div>
    <div id="dbg"></div>
</div>
<div id="wrap">
    <canvas id="c"></canvas>
    <div id="hint">Walk with phone in hand, screen up. If lin|a| pulses and you still get no steps, press Step now.</div>
</div>
<script>
(() => {
    const STEP_LEN = 0.62;
    const COOLDOWN = 260;
    let mapping = false, steps = 0, hdg = 0, x = 0, y = 0;
    let path = [{x:0,y:0}];
    let lastStep = 0, armed = true;
    let grav = {x:0,y:0,z:9.81};
    let lastGyroT = 0;
    let haveCompass = false;
    let lastLin = 0;
    let src = 'none';

    const $ = id => document.getElementById(id);
    const canvas = $('c'), ctx = canvas.getContext('2d');

    function log(m, cls) {
        const d = document.createElement('div');
        if (cls) d.className = cls;
        d.textContent = '[' + new Date().toLocaleTimeString() + '] ' + m;
        $('dbg').appendChild(d);
        $('dbg').scrollTop = $('dbg').scrollHeight;
    }

    function resize() {
        const r = canvas.parentElement.getBoundingClientRect();
        canvas.width = r.width * devicePixelRatio;
        canvas.height = r.height * devicePixelRatio;
        ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
        draw();
    }
    window.addEventListener('resize', resize);

    function draw() {
        const w = canvas.parentElement.clientWidth, h = canvas.parentElement.clientHeight;
        ctx.clearRect(0,0,w,h);
        const s = 28, cx = w/2, cy = h/2;
        ctx.save(); ctx.translate(cx,cy);
        ctx.beginPath();
        path.forEach((p,i) => i ? ctx.lineTo(p.x*s, -p.y*s) : ctx.moveTo(p.x*s, -p.y*s));
        ctx.strokeStyle = '#00e6c3'; ctx.lineWidth = 3; ctx.lineJoin = 'round'; ctx.stroke();
        const px = x*s, py = -y*s, rad = hdg * Math.PI/180;
        ctx.beginPath(); ctx.arc(px,py,7,0,Math.PI*2);
        ctx.fillStyle = '#ff3b6b'; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
        ctx.beginPath(); ctx.moveTo(px,py);
        ctx.lineTo(px + Math.sin(rad)*18, py - Math.cos(rad)*18);
        ctx.strokeStyle = '#fff'; ctx.stroke();
        ctx.restore();
    }

    function setHdg(deg, from) {
        if (deg == null || Number.isNaN(deg)) return;
        hdg = (deg % 360 + 360) % 360;
        $('hdg').textContent = Math.round(hdg) + '° ' + (from || '');
        if (from === 'compass') haveCompass = true;
        draw();
    }

    function step() {
        const rad = hdg * Math.PI/180;
        steps++;
        x += Math.sin(rad) * STEP_LEN;
        y += Math.cos(rad) * STEP_LEN;
        path.push({x,y});
        $('steps').textContent = steps;
        $('px').textContent = x.toFixed(2);
        $('py').textContent = y.toFixed(2);
        draw();
    }

    function considerStep(lin) {
        lastLin = lin;
        $('mag').textContent = lin.toFixed(2);
        if (!mapping) return;
        const now = performance.now();
        // Adaptive: rest ~0.1–0.4, walk peaks ~1.5–8
        const thresh = 0.85;
        if (armed && lin > thresh && now - lastStep > COOLDOWN) {
            armed = false;
            lastStep = now;
            step();
        }
        if (lin < thresh * 0.45) armed = true;
    }

    function ingestAccel(ax, ay, az, includingG, tag) {
        if (ax == null && ay == null && az == null) return;
        ax = ax || 0; ay = ay || 0; az = az || 0;
        $('raw').textContent =
            `ax=${ax.toFixed(2)} ay=${ay.toFixed(2)} az=${az.toFixed(2)}  ` + $('raw').textContent.replace(/^ax=.*?  /,'');
        src = tag;
        $('src').textContent = tag;
        let lin;
        if (includingG) {
            grav.x = 0.1*ax + 0.9*grav.x;
            grav.y = 0.1*ay + 0.9*grav.y;
            grav.z = 0.1*az + 0.9*grav.z;
            lin = Math.hypot(ax-grav.x, ay-grav.y, az-grav.z);
        } else {
            lin = Math.hypot(ax, ay, az);
        }
        considerStep(lin);
    }

    function ingestGyro(gx, gy, gz) {
        if (gx == null && gy == null && gz == null) return;
        gx = gx || 0; gy = gy || 0; gz = gz || 0;
        const parts = $('raw').textContent.split('  ');
        $('raw').textContent = (parts[0] || 'ax=— ay=— az=—') +
            `  gx=${gx.toFixed(2)} gy=${gy.toFixed(2)} gz=${gz.toFixed(2)}`;
        const t = performance.now();
        if (lastGyroT && !haveCompass) {
            const dt = (t - lastGyroT) / 1000;
            // phone screen-up: yaw ≈ -gz (rad/s) in device frame — good enough to turn
            setHdg(hdg - gz * dt * 180/Math.PI, 'gyro');
        }
        lastGyroT = t;
        src = src.includes('gyro') ? src : src + '+gyro';
        $('src').textContent = src;
    }

    function compassFrom(e) {
        if (typeof e.webkitCompassHeading === 'number') return e.webkitCompassHeading;
        if (e.alpha == null) return null;
        return (360 - e.alpha) % 360;
    }

    function onOrient(e) {
        const h = compassFrom(e);
        if (h == null) return;
        setHdg(h, 'compass');
    }

    function onMotion(e) {
        const a = e.acceleration;
        const g = e.accelerationIncludingGravity;
        const r = e.rotationRate;
        if (a && (a.x != null || a.y != null || a.z != null) && (a.x || a.y || a.z)) {
            ingestAccel(a.x, a.y, a.z, false, 'devicemotion.lin');
        } else if (g && (g.x != null || g.y != null || g.z != null)) {
            ingestAccel(g.x, g.y, g.z, true, 'devicemotion.g');
        }
        if (r) ingestGyro(
            (r.alpha != null ? r.alpha * Math.PI/180 : r.x),
            (r.beta  != null ? r.beta  * Math.PI/180 : r.y),
            (r.gamma != null ? r.gamma * Math.PI/180 : r.z)
        );
    }

    function startGeneric(name, Ctor, hz, onread) {
        if (typeof Ctor !== 'function') { log(name + ' API missing'); return null; }
        try {
            const s = new Ctor({ frequency: hz });
            s.addEventListener('reading', () => onread(s));
            s.addEventListener('error', ev => log(name + ' error: ' + (ev.error && ev.error.name), 'err'));
            s.start();
            log(name + ' started', 'ok');
            return s;
        } catch (e) {
            log(name + ' failed: ' + e.message, 'err');
            return null;
        }
    }

    async function perm(name) {
        if (!navigator.permissions || !navigator.permissions.query) return;
        try {
            const p = await navigator.permissions.query({ name });
            log('permission ' + name + ' = ' + p.state);
        } catch (_) {}
    }

    $('go').onclick = async () => {
        log(window.isSecureContext ? 'secure context ok' : 'NOT HTTPS — sensors often empty', 'err');

        if (typeof DeviceMotionEvent !== 'undefined' && DeviceMotionEvent.requestPermission) {
            try { log('motion perm ' + await DeviceMotionEvent.requestPermission()); }
            catch (e) { log('motion perm fail ' + e, 'err'); }
        }
        if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission) {
            try { log('orient perm ' + await DeviceOrientationEvent.requestPermission()); }
            catch (e) { log('orient perm fail ' + e, 'err'); }
        }
        await perm('accelerometer');
        await perm('gyroscope');
        await perm('magnetometer');

        window.addEventListener('devicemotion', onMotion, true);
        window.addEventListener('deviceorientation', onOrient, true);
        if ('ondeviceorientationabsolute' in window) {
            window.addEventListener('deviceorientationabsolute', onOrient, true);
            log('absolute orientation attached');
        }

        startGeneric('Accelerometer', window.Accelerometer, 60, s => ingestAccel(s.x, s.y, s.z, true, 'Accelerometer'));
        startGeneric('LinearAccelerationSensor', window.LinearAccelerationSensor, 60, s => ingestAccel(s.x, s.y, s.z, false, 'LinearAccel'));
        startGeneric('Gyroscope', window.Gyroscope, 60, s => ingestGyro(s.x, s.y, s.z));
        startGeneric('AbsoluteOrientationSensor', window.AbsoluteOrientationSensor, 30, s => {
            // quaternion [x,y,z,w] → yaw
            const [qx,qy,qz,qw] = s.quaternion || [];
            if (qw == null) return;
            const yaw = Math.atan2(2*(qw*qz + qx*qy), 1 - 2*(qy*qy + qz*qz));
            setHdg(-yaw * 180/Math.PI, 'abs-orient');
        });

        mapping = true;
        $('go').style.display = 'none';
        $('reset').style.display = 'block';
        $('mark').style.display = 'block';
        resize();
        log('Walk. Watch lin|a| — it must jump each footfall.');
        setTimeout(() => {
            if ($('mag').textContent === '0.00' && $('hdg').textContent === '—') {
                log('Still zero samples. Chrome → Site settings → Motion sensors = Allow. Reload.', 'err');
            }
        }, 2500);
    };

    $('reset').onclick = () => {
        steps = 0; x = 0; y = 0; path = [{x:0,y:0}];
        $('steps').textContent = '0'; $('px').textContent = '0.00'; $('py').textContent = '0.00';
        draw(); log('reset');
    };
    $('mark').onclick = () => { step(); log('manual step'); };

    resize();
})();
</script>
</body>
</html>
