<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Permissions-Policy" content="accelerometer=*, gyroscope=*, magnetometer=*">
    <title>IMU Room Mapper</title>
    <style>
        :root {
            --bg: #0b0f14;
            --panel: rgba(12, 18, 24, 0.94);
            --cyan: #00e6c3;
            --red: #ff3b6b;
            --muted: #8aa0b3;
            --warn: #ffd166;
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: var(--bg); color: var(--cyan);
            font-family: ui-monospace, "Courier New", monospace;
            overflow: hidden; display: flex; flex-direction: column;
            touch-action: none;
        }
        #ui {
            padding: 12px; background: var(--panel);
            border-bottom: 1px solid #1c3a3a; z-index: 10;
            display: flex; flex-direction: column; gap: 8px;
        }
        .row { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
        .muted { color: var(--muted); font-size: 11px; }
        .warn { color: var(--warn); }
        .err { color: var(--red); }
        .ok { color: var(--cyan); }
        button {
            flex: 1; padding: 12px; font-size: 15px; font-weight: 700;
            border: 0; border-radius: 6px; text-transform: uppercase;
            touch-action: manipulation; cursor: pointer;
        }
        #start-btn { background: var(--cyan); color: #04110e; }
        #reset-btn { background: var(--red); color: #fff; }
        #mark-btn { background: #1b3a4a; color: var(--cyan); display: none; }
        .btns { display: flex; gap: 8px; }
        #debug {
            font-size: 10px; color: var(--warn); background: #000;
            padding: 6px; height: 72px; overflow-y: auto;
            border: 1px solid #333; white-space: pre-wrap;
        }
        #canvas-wrap {
            flex: 1; position: relative; background: #000;
            background-image:
                linear-gradient(rgba(0,230,195,0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,230,195,0.08) 1px, transparent 1px);
            background-size: 24px 24px;
        }
        canvas { display: block; width: 100%; height: 100%; }
        #hint {
            position: absolute; left: 8px; right: 8px; bottom: 8px;
            font-size: 11px; color: var(--muted); pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div class="row">
            <span>Steps: <b id="step-count">0</b></span>
            <span>Heading: <b id="heading-data">—</b></span>
        </div>
        <div class="row">
            <span>X <b id="pos-x">0.00</b> m</span>
            <span>Y <b id="pos-y">0.00</b> m</span>
        </div>
        <div class="row muted">
            <span>Accel |a|: <b id="accel-mag">0.00</b></span>
            <span>Events: motion <b id="motion-n">0</b> / orient <b id="orient-n">0</b></span>
        </div>
        <div class="row muted" id="secure-row"></div>
        <div class="btns">
            <button id="start-btn">Enable sensors</button>
            <button id="mark-btn">Mark corner</button>
            <button id="reset-btn" style="display:none">Reset</button>
        </div>
        <div id="debug">Tap Enable sensors, then walk with the phone flat in your hand (screen up).\n</div>
    </div>
    <div id="canvas-wrap">
        <canvas id="map-canvas"></canvas>
        <div id="hint">North is up. Hold phone level. Walk naturally — steps fire on bounce, not tilt.</div>
    </div>

<script>
(() => {
    const STEP_LEN = 0.65;
    const COOLDOWN_MS = 280;
    const PEAK_MIN = 1.15;          // user-accel peak (m/s²) after gravity removal
    const GRAVITY = 9.81;

    let mapping = false;
    let steps = 0, headingDeg = 0, headingRad = 0;
    let posX = 0, posY = 0;
    let path = [{ x: 0, y: 0 }];
    let lastStep = 0;
    let motionN = 0, orientN = 0;
    let lastMag = 0, rising = false;
    let grav = { x: 0, y: 0, z: GRAVITY };
    const GRAV_ALPHA = 0.12;

    const $ = (id) => document.getElementById(id);
    const startBtn = $('start-btn');
    const resetBtn = $('reset-btn');
    const markBtn = $('mark-btn');
    const canvas = $('map-canvas');
    const ctx = canvas.getContext('2d');

    function log(msg, cls = '') {
        const t = new Date().toLocaleTimeString();
        const line = document.createElement('div');
        line.className = cls;
        line.textContent = `[${t}] ${msg}`;
        $('debug').appendChild(line);
        $('debug').scrollTop = $('debug').scrollHeight;
    }

    const secure = window.isSecureContext;
    $('secure-row').innerHTML = secure
        ? '<span class="ok">Secure context: yes (HTTPS / localhost)</span>'
        : '<span class="err">NOT a secure context — Chrome will not send IMU data. Open this file via HTTPS or a local server.</span>';
    if (!secure) log('Sensors blocked: page is not HTTPS.', 'err');

    function resize() {
        canvas.width = canvas.parentElement.clientWidth * devicePixelRatio;
        canvas.height = canvas.parentElement.clientHeight * devicePixelRatio;
        ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
        draw();
    }
    window.addEventListener('resize', resize);

    function draw() {
        const w = canvas.parentElement.clientWidth;
        const h = canvas.parentElement.clientHeight;
        ctx.clearRect(0, 0, w, h);
        const cx = w / 2, cy = h / 2, s = 28;
        ctx.save();
        ctx.translate(cx, cy);
        if (path.length) {
            ctx.beginPath();
            ctx.moveTo(path[0].x * s, -path[0].y * s);
            for (let i = 1; i < path.length; i++) ctx.lineTo(path[i].x * s, -path[i].y * s);
            ctx.strokeStyle = '#00e6c3';
            ctx.lineWidth = 3;
            ctx.lineJoin = 'round';
            ctx.stroke();
        }
        const px = posX * s, py = -posY * s;
        ctx.beginPath();
        ctx.arc(px, py, 7, 0, Math.PI * 2);
        ctx.fillStyle = '#ff3b6b';
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(px, py);
        ctx.lineTo(px + Math.sin(headingRad) * 18, py - Math.cos(headingRad) * 18);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();
    }

    function compassFromEvent(e) {
        if (typeof e.webkitCompassHeading === 'number' && !Number.isNaN(e.webkitCompassHeading)) {
            return e.webkitCompassHeading;
        }
        if (e.alpha == null) return null;
        // Android Chrome: absolute event already uses north. Convert to compass heading.
        if (e.absolute === true || e.type === 'deviceorientationabsolute') {
            return (360 - e.alpha) % 360;
        }
        return (360 - e.alpha) % 360;
    }

    function handleOrientation(e) {
        orientN++;
        $('orient-n').textContent = orientN;
        const h = compassFromEvent(e);
        if (h == null) return;
        headingDeg = h;
        headingRad = h * Math.PI / 180;
        $('heading-data').textContent = Math.round(h) + '°';
        if (mapping) draw();
    }

    function userAccelMagnitude(e) {
        const ua = e.acceleration;
        if (ua && (ua.x != null || ua.y != null || ua.z != null)) {
            const x = ua.x || 0, y = ua.y || 0, z = ua.z || 0;
            return Math.hypot(x, y, z);
        }
        const g = e.accelerationIncludingGravity;
        if (!g) return 0;
        const gx = g.x || 0, gy = g.y || 0, gz = g.z || 0;
        grav.x = GRAV_ALPHA * gx + (1 - GRAV_ALPHA) * grav.x;
        grav.y = GRAV_ALPHA * gy + (1 - GRAV_ALPHA) * grav.y;
        grav.z = GRAV_ALPHA * gz + (1 - GRAV_ALPHA) * grav.z;
        return Math.hypot(gx - grav.x, gy - grav.y, gz - grav.z);
    }

    function handleMotion(e) {
        motionN++;
        if (motionN === 1) log('First motion event received.', 'ok');
        $('motion-n').textContent = motionN;
        if (!mapping) return;

        const mag = userAccelMagnitude(e);
        lastMag = mag;
        $('accel-mag').textContent = mag.toFixed(2);

        const now = performance.now();
        if (mag > PEAK_MIN) {
            if (!rising && now - lastStep > COOLDOWN_MS) {
                rising = true;
                lastStep = now;
                registerStep();
            }
        } else if (mag < PEAK_MIN * 0.55) {
            rising = false;
        }
    }

    function registerStep() {
        steps++;
        posX += Math.sin(headingRad) * STEP_LEN;
        posY += Math.cos(headingRad) * STEP_LEN;
        path.push({ x: posX, y: posY });
        $('step-count').textContent = steps;
        $('pos-x').textContent = posX.toFixed(2);
        $('pos-y').textContent = posY.toFixed(2);
        draw();
    }

    async function requestPermission(ctor, name) {
        if (!ctor || typeof ctor.requestPermission !== 'function') return 'not-required';
        try {
            return await ctor.requestPermission();
        } catch (err) {
            log(name + ' permission error: ' + err, 'err');
            return 'error';
        }
    }

    function attachListeners() {
        const abs = 'ondeviceorientationabsolute' in window;
        if (abs) {
            window.addEventListener('deviceorientationabsolute', handleOrientation, true);
            log('Orientation: deviceorientationabsolute');
        }
        window.addEventListener('deviceorientation', handleOrientation, true);
        if (!abs) log('Orientation: deviceorientation (relative — walk after a figure-8 calibrate)');
        window.addEventListener('devicemotion', handleMotion, true);
        log('Motion listener attached.');
    }

    startBtn.addEventListener('click', async () => {
        log('Requesting sensor access…');
        const o = await requestPermission(window.DeviceOrientationEvent, 'orientation');
        const m = await requestPermission(window.DeviceMotionEvent, 'motion');
        log('orientation=' + o + ' motion=' + m);

        attachListeners();
        mapping = true;
        startBtn.style.display = 'none';
        resetBtn.style.display = 'block';
        markBtn.style.display = 'block';
        resize();

        setTimeout(() => {
            if (motionN === 0) {
                log('No motion events after 2s. On Android Chrome: Site settings → this site → allow Motion sensors. Must be HTTPS.', 'err');
            }
            if (orientN === 0) {
                log('No compass events. Wave the phone in a figure-8. Disable battery saver.', 'warn');
            }
        }, 2000);
    });

    resetBtn.addEventListener('click', () => {
        steps = 0; posX = 0; posY = 0;
        path = [{ x: 0, y: 0 }];
        $('step-count').textContent = '0';
        $('pos-x').textContent = '0.00';
        $('pos-y').textContent = '0.00';
        draw();
        log('Map reset.');
    });

    markBtn.addEventListener('click', () => {
        path.push({ x: posX, y: posY });
        log('Corner marked at ' + posX.toFixed(2) + ', ' + posY.toFixed(2));
        draw();
    });

    // Tap screen to force a step if sensors are dead (debug / fallback)
    canvas.addEventListener('click', () => {
        if (!mapping) return;
        registerStep();
        log('Manual step (canvas tap).');
    });

    resize();
})();
</script>
</body>
</html>
