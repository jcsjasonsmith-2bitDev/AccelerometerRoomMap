<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HTML5 IMU Room Mapper</title>
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #00ffcc;
            --button-bg: #1e1e1e;
            --canvas-bg: #000000;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        #ui-container {
            padding: 15px;
            background-color: rgba(18, 18, 18, 0.9);
            z-index: 10;
            border-bottom: 1px solid var(--text-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .data-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
        }
        button {
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            color: var(--bg-color);
            background-color: var(--text-color);
            border: none;
            border-radius: 5px;
            text-transform: uppercase;
            touch-action: manipulation;
            cursor: pointer;
        }
        button:active {
            opacity: 0.7;
        }
        #canvas-container {
            flex-grow: 1;
            position: relative;
            width: 100%;
            background-color: var(--canvas-bg);
            background-image: 
                linear-gradient(rgba(0, 255, 204, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 204, 0.1) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #status-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border: 1px solid var(--text-color);
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <div class="data-row">
            <span>Steps: <span id="step-count">0</span></span>
            <span>Heading: <span id="heading-data">0°</span></span>
        </div>
        <div class="data-row">
            <span>Pos X: <span id="pos-x">0.00</span>m</span>
            <span>Pos Y: <span id="pos-y">0.00</span>m</span>
        </div>
        <button id="start-btn">Start Mapping Sequence</button>
        <button id="reset-btn" style="display: none; background-color: #ff3366; color: white;">Reset Map</button>
    </div>

    <div id="canvas-container">
        <div id="status-overlay">
            Press START to request sensor access and begin mapping. Walk slowly around the room.
        </div>
        <canvas id="map-canvas"></canvas>
    </div>

    <script>
        // State variables
        let isMapping = false;
        let steps = 0;
        let currentHeading = 0; // In radians
        let currentHeadingDegrees = 0;
        let posX = 0;
        let posY = 0;
        const stepLength = 0.6; // Average step length in meters
        
        // Sensor threshold variables for step detection
        const stepThreshold = 12.0; // m/s^2 magnitude to count as a step
        let lastStepTime = 0;
        const stepCooldown = 400; // milliseconds

        // Path history for drawing
        let path = [{ x: 0, y: 0 }];

        // DOM Elements
        const startBtn = document.getElementById('start-btn');
        const resetBtn = document.getElementById('reset-btn');
        const stepCountEl = document.getElementById('step-count');
        const headingEl = document.getElementById('heading-data');
        const posXEl = document.getElementById('pos-x');
        const posYEl = document.getElementById('pos-y');
        const statusOverlay = document.getElementById('status-overlay');
        const canvas = document.getElementById('map-canvas');
        const ctx = canvas.getContext('2d');

        // Resize Canvas dynamically
        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            drawMap();
        }
        window.addEventListener('resize', resizeCanvas);

        // Core Drawing Function
        function drawMap() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            
            // Scaling factor (pixels per meter)
            const scale = 30;

            ctx.save();
            ctx.translate(centerX, centerY);

            // Draw path
            if (path.length > 0) {
                ctx.beginPath();
                ctx.moveTo(path[0].x * scale, -path[0].y * scale); // Invert Y for standard Cartesian
                
                for (let i = 1; i < path.length; i++) {
                    ctx.lineTo(path[i].x * scale, -path[i].y * scale);
                }
                
                ctx.strokeStyle = '#00ffcc';
                ctx.lineWidth = 3;
                ctx.lineJoin = 'round';
                ctx.stroke();
            }

            // Draw current position indicator
            ctx.beginPath();
            ctx.arc(posX * scale, -posY * scale, 6, 0, Math.PI * 2);
            ctx.fillStyle = '#ff3366';
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Draw heading indicator (small line pointing in current direction)
            ctx.beginPath();
            ctx.moveTo(posX * scale, -posY * scale);
            const pointerX = posX * scale + Math.sin(currentHeading) * 15;
            const pointerY = -posY * scale - Math.cos(currentHeading) * 15; 
            ctx.lineTo(pointerX, pointerY);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.restore();
        }

        // Handle Orientation Data (Compass Heading)
        function handleOrientation(event) {
            let alpha = 0;

            // iOS absolute heading
            if (event.webkitCompassHeading) {
                alpha = event.webkitCompassHeading;
            } 
            // Android absolute heading fallback
            else if (event.absolute && event.alpha !== null) {
                alpha = 360 - event.alpha; 
            } else {
                alpha = event.alpha || 0;
            }

            currentHeadingDegrees = alpha;
            // Convert to radians (0 is North, clockwise)
            currentHeading = alpha * (Math.PI / 180);
            headingEl.innerText = Math.round(alpha) + '°';
            
            if(isMapping) drawMap();
        }

        // Handle Motion Data (Step Detection via Accelerometer)
        function handleMotion(event) {
            if (!isMapping) return;

            const acc = event.accelerationIncludingGravity;
            if (!acc) return;

            // Calculate vector magnitude
            const magnitude = Math.sqrt(
                Math.pow(acc.x || 0, 2) + 
                Math.pow(acc.y || 0, 2) + 
                Math.pow(acc.z || 0, 2)
            );

            const currentTime = new Date().getTime();

            // Peak detection for step counting
            if (magnitude > stepThreshold && (currentTime - lastStepTime > stepCooldown)) {
                lastStepTime = currentTime;
                steps++;
                stepCountEl.innerText = steps;

                // Dead Reckoning Math: Update position based on step length and heading
                posX += Math.sin(currentHeading) * stepLength;
                posY += Math.cos(currentHeading) * stepLength; // North is positive Y

                posXEl.innerText = posX.toFixed(2);
                posYEl.innerText = posY.toFixed(2);

                path.push({ x: posX, y: posY });
                drawMap();
            }
        }

        // Initialization and Permissions
        startBtn.addEventListener('click', async () => {
            // Request permissions for iOS 13+ devices
            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                try {
                    const permissionState = await DeviceMotionEvent.requestPermission();
                    if (permissionState === 'granted') {
                        startMapping();
                    } else {
                        alert('Permission to access device sensors was denied.');
                    }
                } catch (error) {
                    console.error(error);
                    alert('Error requesting sensor permissions.');
                }
            } else {
                // Non-iOS 13+ devices
                startMapping();
            }
        });

        resetBtn.addEventListener('click', () => {
            steps = 0;
            posX = 0;
            posY = 0;
            path = [{ x: 0, y: 0 }];
            stepCountEl.innerText = steps;
            posXEl.innerText = '0.00';
            posYEl.innerText = '0.00';
            drawMap();
        });

        function startMapping() {
            isMapping = true;
            statusOverlay.style.display = 'none';
            startBtn.style.display = 'none';
            resetBtn.style.display = 'block';

            window.addEventListener('deviceorientation', handleOrientation, true);
            window.addEventListener('devicemotion', handleMotion, true);

            // Optional: Grab high-level Wi-Fi assisted GPS location for global anchor mapping (logged to console)
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition((position) => {
                    console.log("Global Anchor Established:", position.coords.latitude, position.coords.longitude);
                }, (err) => {
                    console.warn("Geolocation anchor unavailable", err);
                }, { enableHighAccuracy: true });
            }

            resizeCanvas(); // Initialize canvas sizing
        }

        // Initial setup
        resizeCanvas();
    </script>
</body>
</html>
